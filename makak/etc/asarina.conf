# asarina configuration for Makak (morpheus), the fixed wide-field camera at the
# north celestial pole region (Dec ~63-84)
# mi0315 (Moravian G1-2000, ICX274, ~57"/px, 10 s frames every 11.5 s).
#
# Read by asarina-imgproc through `asarina-watch --config` (see
# systemd/makak-asarina.service).  It can later become /etc/asarina/config on
# morpheus: there every frame is Makak, hence [DEFAULT] and no camera section
# (RTS2 names it C0, which would read as D50 anywhere else).

[DEFAULT]
# Dark frames (slitposx < 0.5) go to the nightly dark statistics, mi0315 crop
# (the 1199x1199 square), pyrt-dophot -k
makak = true
# Per-pixel dark(T) model, the temperature fitted per frame; no flat
smart_dark = /home/mates/asarina+makak/data/makak-dark-response.npy

# Detection: moonlit clouds are 100-200 px blobs.  pyrt-phcat's 256 px
# background mesh leaves them in, they pass for stars and set its FWHM
# estimate to 30-120 px (18 detections instead of ~180).  A 32 px mesh follows
# them, and the fixed FWHM (detection kernel) keeps the stars.
phcat_fwhm = 4
phcat_back_size = 32
# The stars are small on this camera: a fixed 4 px aperture radius.  From the
# FWHM estimate (2.9-5.7 px frame to frame) the zeropoint jumped with it.
phcat_aperture = 4
# ... measured by SExtractor (MAG_APER, sky from a local 12 px annulus) instead
# of IRAF phot: the same zeropoints (0.015 mag lower), 2 s of 29 faster on morpheus
phcat_noiraf = true

# Astrometry: the camera does not move, so the last solution turned by the
# sidereal angle starts each frame; pyrt-field-solve only when that is rejected
wcs_guess_dir = /home/mates/asarina+makak/state
# Through clouds the stars cover too little of the chip to verify the refit
# (ASTQUAL=PARTIAL, COVER < 0.75): photometry on the guess as it is, rather
# than rejecting the frame; only verified solutions become the next guess
wcs_guess_keep = true
pixel_scale = 57
# Start the refit from pyrt's mi0315 ZPN model (cameras.ini): with the
# field-solve TAN about one frame in three ends ASTQUAL=PARTIAL on CHI2C
zpn_from_camera = true
# Stiff astrometry: the camera ZPN held fixed, only CRVAL and CD refitted,
# no SIP in any pass.  SIP 2 (sip = 1 escalates in pass 2) was taken on half
# the frames but moved ASTSIGMA by 0.01 px and no zeropoint at all.
sip = 0

# Photometry, as makak-reloaded had it
dophot_model = /home/mates/asarina+makak/data/makak-model.mod
dophot_catalog = makak
dophot_maglim = 8
dophot_enlarge = 1.5
# makak-reloaded had .p4,.r4,RC,RO,RS; when the stepwise fit takes RC and RO
# in (RC ~ 3.7 +- 2.3), the zeropoint jumps by 0.3-0.4 mag, frame to frame.
# RS alone keeps it steady (and is all a good frame keeps anyway).
dophot_terms = .p4,.r4,RS
# RS on a good frame is -0.06..-0.01; ~0.9 means few or wrong matches and
# the calibration collapsed (slope 0.1): PHQUAL=BADFIT, out of the sky map
phqual_rs_max = 0.2
dophot_idlimit = 5
dophot_max_stars = 0
passes = 2
# A cloudy frame with a dozen stars still measures the extinction
min_idnum = 10

# Sky map (asarina-skymap --profile makak): the clean frames (ASTQUAL and
# PHQUAL OK, MAGZERO >= 18.4, i.e. no clouds) weight-added into 51.5"/px tiles.
# ~3 s a frame, ~70 MB of tiles rewritten: on the HDD, not the system SSD
skymap_dir = /storage/makak-skymap
skymap_profile = makak

# The archive in /images belongs to root and RTS2: read only
no_raw_update = true

# Output
phdb_root = /home/mates/asarina+makak/ecsv
phdb_date_fmt = %Y%m%d
phdb_by_night = true
png_root = /home/mates/asarina+makak/png
daily_summary_dir = /home/mates/asarina+makak/nght
