# asarina-reprocess on zeus: the whole Makak archive through the service's
# config, newest night first, into /storage/home/mates/makak-reprocess and
# phdb-makak (the ECSVs).
#   asarina-reprocess --setup ~/asarina+makak/etc/reprocess-zeus.ini run|report
# zeus has other duties: 8 workers on its 12 cores (24 threads), at nice 19.

[reprocess]
state = /storage/home/mates/makak-reprocess/state.sqlite
logdir = /storage/home/mates/makak-reprocess/log
workers = 8
timeout = 1800
nice = 19
photdb = no

[archive MAKAK]
root = /storage/archive-images/MAKAK/images
config = ~/asarina+makak/etc/asarina.conf
# later nights are the realtime service's (morpheus)
until = 20261028
# the service's outputs on morpheus replaced by these: the ECSVs in phdb-makak
# (not phdb, not the photometric DB: that is D50 and SBT); the map is the sky map
# of the whole archive (asarina-skymap --profile makak)
args = --wcs-guess /storage/home/mates/makak-reprocess/state
	--phdb-root /storage/home/mates/phdb-makak
	--daily-summary /storage/home/mates/makak-reprocess/nght
	--png-root /storage/home/mates/makak-reprocess/png
	--skymap-dir /storage/home/mates/makak-reprocess/map
